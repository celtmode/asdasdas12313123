<!--
  ParsCord simplified loading screen ("Gilded" theme).

  - Minimal and elegant design
  - Gold and black theme
  - Smooth animations
  - Progress bar connected to Discord API status
  - Non-fullscreen centered layout
-->
<style>
  /* Gilded Theme Variables */
  :root {
    --pc-gold-primary: #d7b665;
    --pc-gold-bright: #f0d9a0;
    --pc-gold-deep: #a88a4a;
    --pc-black: #080705;
    --pc-dark: #12100b;
    --pc-panel: #1a1812;
  
    --pc-void: #000000;
    --pc-bg: linear-gradient(135deg, #0d0b06 0%, #15120e 50%, #0d0b06 100%);
    --pc-glow: radial-gradient(ellipse at center, rgba(215, 182, 101, 0.15) 0%, transparent 70%);
  }

  #loadingContainer {
    position: fixed;
    inset: 0;
    z-index: 99999;
    
    margin: 0;
    border: 0;
    padding: 0;
    outline: none;
    
    // Centered non-fullscreen layout
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    
    background: var(--pc-void);
    color: var(--pc-gold-primary);
    font-family: "Segoe UI", "SF Pro Display", "Inter", sans-serif;
    
    opacity: 1;
    transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  #loadingContainer.is-leaving {
    opacity: 0;
    pointer-events: none;
  }

  #loadingContainer *,
  #loadingContainer *::before,
  #loadingContainer *::after {
    box-sizing: border-box;
  }

  /* Logo Section */
  .pc-logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 48px;
    animation: pc-fade-in 1s ease-out;
  }

  .pc-logo {
    width: 72px;
    height: 72px;
    margin-bottom: 16px;
    animation: pc-scale-in 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .pc-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, var(--pc-gold-primary) 0%, var(--pc-gold-bright) 50%, var(--pc-gold-primary) 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: pc-gradient-shift 4s ease infinite;
    text-shadow: 0 0 40px rgba(215, 182, 101, 0.3);
  }

  .pc-subtitle {
    font-size: 14px;
    color: var(--pc-gold-deep);
    margin-top: 6px;
    font-weight: 400;
    opacity: 0.8;
  }

  /* Progress Container */
  .pc-progress-wrapper {
    width: 320px;
    max-width: 80vw;
    margin-bottom: 24px;
    animation: pc-fade-in 1s ease-out 0.2s both;
  }

  .pc-progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--pc-gold-deep);
  }

  .pc-progress-value {
    font-weight: 600;
    color: var(--pc-gold-bright);
    font-variant-numeric: tabular-nums;
  }

  .pc-progress-track {
    position: relative;
    width: 100%;
    height: 6px;
    background: var(--pc-panel);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
  }

  .pc-progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    background: var(--pc-gold-primary);
    border-radius: 4px;
    will-change: width;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.3s ease;
    box-shadow: 0 0 20px rgba(215, 182, 101, 0.4),
                0 0 40px rgba(215, 182, 101, 0.2);
  }

  .pc-progress-fill.ready {
    background: var(--pc-gold-bright);
    box-shadow: 0 0 20px rgba(240, 217, 160, 0.6),
                0 0 40px rgba(240, 217, 160, 0.3);
  }

  .pc-progress-indicator {
    position: absolute;
    top: 50%;
    right: -6px;
    width: 16px;
    height: 16px;
    background: var(--pc-gold-bright);
    border-radius: 50%;
    transform: translateY(-50%);
    box-shadow: 0 0 12px rgba(240, 217, 160, 0.8),
                0 0 24px rgba(240, 217, 160, 0.5);
    animation: pc-glow-pulse 2s ease-in-out infinite;
  }

  /* Status Messages */
  .pc-status {
    font-size: 12px;
    color: var(--pc-gold-deep);
    margin-bottom: 32px;
    min-height: 18px;
    text-align: center;
    opacity: 0.7;
    animation: pc-fade-in 1s ease-out 0.4s both;
  }

  /* Welcome Section */
  .pc-welcome {
    text-align: center;
    animation: pc-fade-in 1s ease-out 0.6s both;
  }

  .pc-welcome h2 {
    margin: 0 0 8px 0;
    font-size: 20px;
    color: var(--pc-gold-bright);
    font-weight: 600;
  }

  .pc-welcome p {
    margin: 0;
    font-size: 14px;
    color: var(--pc-gold-deep);
    opacity: 0.7;
  }

  /* Button */
  .pc-enter-button {
    margin-top: 32px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    color: var(--pc-black);
    
    background: linear-gradient(135deg, var(--pc-gold-primary) 0%, var(--pc-gold-bright) 100%);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    
    opacity: 0;
    animation: pc-fade-in-up 0.6s ease-out 0.8s forwards, pc-button-glow 3s ease-in-out infinite 0.9s;
  }

  .pc-enter-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(215, 182, 101, 0.4),
                0 0 40px rgba(215, 182, 101, 0.2);
  }

  .pc-enter-button:active {
    transform: translateY(0);
  }

  .pc-enter-button.visible {
    opacity: 1;
  }

  /* Background Effects */
  .pc-background {
    position: fixed;
    inset: 0;
    background: var(--pc-bg);
    z-index: -1;
  }

  .pc-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    background: var(--pc-glow);
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    animation: pc-glow-slow 12s ease-in-out infinite;
  }

  .pc-glow--top-left {
    top: -200px;
    left: -200px;
  }

  .pc-glow--bottom-right {
    bottom: -200px;
    right: -200px;
    animation-delay: -6s;
  }

  /* Animations */
  @keyframes pc-fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pc-fade-in-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pc-scale-in {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes pc-gradient-shift {
    0%, 100% { background-position: 0% center; }
    50% { background-position: 200% center; }
  }

  @keyframes pc-glow-pulse {
    0%, 100% { 
      box-shadow: 0 0 12px rgba(240, 217, 160, 0.8),
                  0 0 24px rgba(240, 217, 160, 0.5);
      transform: translateY(-50%) scale(1);
    }
    50% { 
      box-shadow: 0 0 20px rgba(240, 217, 160, 1),
                  0 0 40px rgba(240, 217, 160, 0.7);
      transform: translateY(-50%) scale(1.1);
    }
  }

  @keyframes pc-button-glow {
    0%, 100% {
      box-shadow: 0 4px 16px rgba(215, 182, 101, 0.3),
                  0 0 24px rgba(215, 182, 101, 0.1);
    }
    50% {
      box-shadow: 0 4px 24px rgba(215, 182, 101, 0.5),
                  0 0 40px rgba(215, 182, 101, 0.2);
    }
  }

  @keyframes pc-glow-slow {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
    33% { transform: translate(30px, 30px) scale(1.1); opacity: 0.4; }
    66% { transform: translate(-20px, -20px) scale(1.2); opacity: 0.35; }
  }

  /* Stats Grid */
  .pc-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 32px;
    padding-top: 32px;
    border-top: 1px solid rgba(215, 182, 101, 0.15);
    animation: pc-fade-in 1s ease-out 1s both;
  }

  .pc-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .pc-stat-value {
    font-size: 20px;
    font-weight: 600;
    color: var(--pc-gold-bright);
    font-variant-numeric: tabular-nums;
  }

  .pc-stat-label {
    font-size: 11px;
    color: var(--pc-gold-deep);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .pc-progress-wrapper {
      width: 90%;
    }
    
    .pc-stat {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    
    .pc-stats {
      grid-template-columns: 1fr;
      gap: 16px;
    }
  }
</style>

<div class="pc-background"></div>
<div class="pc-glow pc-glow--top-left"></div>
<div class="pc-glow pc-glow--bottom-right"></div>

<div id="loadingContainer">
  <!-- Logo -->
  <div class="pc-logo-container">
    <svg class="pc-logo" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="pc-logo-bg" x1="6" y1="4" x2="42" y2="46" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#d7b665" />
          <stop offset="1" stop-color="#a88a4a" />
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#pc-logo-bg)" />
      <rect
        x="3"
        y="3"
        width="42"
        height="42"
        rx="10"
        fill="none"
        stroke="rgba(255,255,255,0.15)"
        stroke-width="0.8"
      />
      <g transform="translate(24 24)" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round">
        <path d="M0 -14V14M-12 -7 12 7M-12 7 12 -7" />
        <path
          d="M0 -8 -2.5 -10M0 -8 2.5 -10M0 8 -2.5 10M0 8 2.5 10"
          stroke-width="2"
          opacity="0.8"
        />
      </g>
      <circle cx="24" cy="24" r="2" fill="rgba(255,255,255,0.6)" />
    </svg>
    <h1 class="pc-title">ParsCord</h1>
    <span class="pc-subtitle">Gilded Discord Client</span>
  </div>

  <!-- Progress Bar -->
  <div class="pc-progress-wrapper">
    <div class="pc-progress-label">
      <span id="connectionLabel">Connecting to Discord…</span>
      <span id="progressValue" class="pc-progress-value">0%</span>
    </div>
    <div id="progressTrack" class="pc-progress-track" role="progressbar" aria-label="Loading Discord" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progressFill" class="pc-progress-fill">
        <div class="pc-progress-indicator"></div>
      </div>
    </div>
  </div>

  <!-- Status Message -->
  <div id="mainTitle" class="pc-status">Initializing…</div>

  <!-- Welcome Section -->
  <div class="pc-welcome">
    <h2 id="midtitle" style="display:none;">Welcome to ParsCord</h2>
  </div>

  <!-- Enter Button -->
  <button id="enterDiscord" class="pc-enter-button" type="button">
    Enter Discord
    <span class="pc-enter-glyph" aria-hidden="true" style="margin-right:8px;">
      <svg viewBox="0 0 16 16" width="20" height="20">
        <path
          d="M3.2 8h9.2M8.9 4.4 12.5 8l-3.6 3.6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
  </button>

  <!-- Stats -->
  <div class="pc-stats">
    <div class="pc-stat">
      <span id="sessionState" class="pc-stat-value">0/0</span>
      <span class="pc-stat-label">Shards</span>
    </div>
    <div class="pc-stat">
      <span class="pc-stat-value" id="releaseVersion">Loading…</span>
      <span class="pc-stat-label">Version</span>
    </div>
    <div class="pc-stat">
      <span class="pc-stat-value" id="feedTitle">Ready</span>
      <span class="pc-stat-label">Status</span>
    </div>
  </div>
</div>

<script>
  // Simple JavaScript to update the loading screen
  const progressFill = document.getElementById('progressFill');
  const progressValue = document.getElementById('progressValue');
  const connectionLabel = document.getElementById('connectionLabel');
  const mainTitle = document.getElementById('mainTitle');
  const sessionState = document.getElementById('sessionState');
  const feedTitle = document.getElementById('feedTitle');
  const releaseVersion = document.getElementById('releaseVersion');
  const enterDiscord = document.getElementById('enterDiscord');

  let progress = 0;
  let currentShard = 0;
  let totalShards = 1; // Will be updated by Tauri
  
  // Simulated loading progress (replace with actual Discord gateway status)
  const stages = [
    'Initializing…',
    'Connecting to gateway…',
    'Authenticating…',
    'Starting sessions…',
    'Syncing data…',
    'Almost ready…',
    'Ready!'
  ];

  function updateProgress(percent) {
    progress = Math.min(percent, 100);
    progressFill.style.width = `${progress}%`;
    progressValue.textContent = `${Math.round(progress)}%`;
    
    // Update connection label based on progress
    const stageIndex = Math.min(
      Math.floor(progress / (100 / stages.length)),
      stages.length - 1
    );
    connectionLabel.textContent = stages[stageIndex];
    
    // Add ready class when complete
    if (progress >= 100) {
      progressFill.classList.add('ready');
      progressFill.classList.remove('ready');
      setTimeout(() => progressFill.classList.add('ready'), 50);
      mainTitle.textContent = 'All systems operational';
    }
  }

  function updateSessionState(current, total) {
    currentShard = current;
    totalShards = total;
    sessionState.textContent = `${total > 0 ? `${current}/${total}` : '0/0'}`;
    
    if (total > 0) {
      const percent = (current / total) * 100;
      updateProgress(percent);
    }
  }

  function setReady() {
    progressFill.classList.add('ready');
    connectionLabel.textContent = 'Gateway connected';
    mainTitle.textContent = 'Welcome to ParsCord';
    feedTitle.textContent = 'Online';
    feedTitle.style.color = 'var(--pc-gold-bright)';
    
    // Show enter button
    setTimeout(() => {
      enterDiscord.classList.add('visible');
    }, 500);
  }

  // Update version number
  releaseVersion.textContent = '2.0.0';

  // Channel from main process to update progress
  window.updateLoadingProgress = function(percent) {
    updateProgress(percent);
  };

  window.updateSessionState = function(current, total) {
    updateSessionState(current, total);
  };

  window.setLoadingReady = function() {
    setReady();
  };

  // Handle enter button click
  enterDiscord.addEventListener('click', () => {
    document.getElementById('loadingContainer').classList.add('is-leaving');
    setTimeout(() => {
      document.getElementById('loadingContainer').style.display = 'none';
    }, 400);
  });
</script>
