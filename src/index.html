<!--
  ParsCord loading screen (gold theme).

  - Responsive to app size
  - Discord-like window controls
  - No logo, skip button, or snow elements
-->
<style>
  :root {
    --pc-gold-primary: #d7b665;
    --pc-gold-bright: #f0d9a0;
    --pc-gold-deep: #a88a4a;
    --pc-black: #080705;
    --pc-dark: #12100b;
    --pc-panel: #1a1812;

    --pc-void: #000000;
    --pc-bg: linear-gradient(135deg, #0d0b06 0%, #15120e 50%, #0d0b06 100%);
  }

  #loadingContainer {
    width: 500px;
    height: auto;
    min-height: 400px;
    padding: 24px;
    border-radius: 16px;
    border: 1px solid rgba(215, 182, 101, 0.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(215, 182, 101, 0.1);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: var(--pc-panel);
    color: var(--pc-gold-primary);
    font-family: "Segoe UI", "SF Pro Display", "Inter", sans-serif;

    opacity: 1;
    transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  #loadingContainer.is-leaving {
    opacity: 0;
    pointer-events: none;
  }

  /* Window Controls (Discord-style) */
  .pc-window-controls {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 40px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    z-index: 100;
  }

  .pc-window-btn {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .pc-window-btn:hover {
    transform: scale(1.15);
  }

  .pc-window-btn.close {
    background: #ff5f57;
  }

  .pc-window-btn.minimize {
    background: #febc2e;
  }

  /* Title and Subtitle */
  .pc-title {
    font-size: 28px;
    font-weight: 700;
    color: var(--pc-gold-bright);
    margin-bottom: 6px;
    text-align: center;
    background: linear-gradient(135deg, var(--pc-gold-primary) 0%, var(--pc-gold-bright) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .pc-subtitle {
    font-size: 14px;
    color: var(--pc-gold-deep);
    margin-bottom: 32px;
    text-align: center;
    opacity: 0.8;
  }

  /* Progress Container */
  .pc-progress-wrapper {
    width: 100%;
    max-width: 360px;
    margin-bottom: 24px;
  }

  .pc-progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--pc-gold-deep);
  }

  .pc-progress-value {
    font-weight: 600;
    color: var(--pc-gold-bright);
    font-variant-numeric: tabular-nums;
  }

  .pc-progress-track {
    position: relative;
    width: 100%;
    height: 6px;
    background: var(--pc-void);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
  }

  .pc-progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    background: var(--pc-gold-primary);
    border-radius: 4px;
    will-change: width;
  }

  /* Status Message */
  .pc-status {
    font-size: 12px;
    color: var(--pc-gold-deep);
    margin-bottom: 24px;
    min-height: 18px;
    text-align: center;
    opacity: 0.7;
  }

  /* Welcome Section */
  .pc-welcome {
    text-align: center;
    margin-bottom: 24px;
  }

  .pc-welcome h2 {
    margin: 0;
    font-size: 18px;
    color: var(--pc-gold-bright);
    font-weight: 600;
  }

  /* Enter Button */
  .pc-enter-button {
    margin-top: 8px;
    padding: 12px 32px;
    font-size: 15px;
    font-weight: 600;
    color: var(--pc-black);
    background: linear-gradient(135deg, var(--pc-gold-primary) 0%, var(--pc-gold-bright) 100%);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
  }

  .pc-enter-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(215, 182, 101, 0.4);
  }

  .pc-enter-button.visible {
    opacity: 1;
  }

  /* Background */
  .pc-background {
    position: fixed;
    inset: 0;
    background: var(--pc-bg);
    z-index: -1;
  }

  .pc-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(ellipse at center, rgba(215, 182, 101, 0.1) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
  }

  .pc-glow--top-left {
    top: -200px;
    left: -200px;
  }

  .pc-glow--bottom-right {
    bottom: -200px;
    right: -200px;
  }

  /* Animations */
  @keyframes pc-fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pc-fade-in-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pc-scale-in {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes pc-gradient-shift {
    0%, 100% { background-position: 0% center; }
    50% { background-position: 200% center; }
  }

  @keyframes pc-glow-pulse {
    0%, 100% {
      box-shadow: 0 0 12px rgba(240, 217, 160, 0.8),
                  0 0 24px rgba(240, 217, 160, 0.5);
    }
    50% {
      box-shadow: 0 0 20px rgba(240, 217, 160, 1),
                  0 0 40px rgba(240, 217, 160, 0.7);
    }
  }

  @keyframes pc-button-glow {
    0%, 100% {
      box-shadow: 0 4px 16px rgba(215, 182, 101, 0.3),
                  0 0 24px rgba(215, 182, 101, 0.1);
    }
    50% {
      box-shadow: 0 4px 24px rgba(215, 182, 101, 0.5),
                  0 0 40px rgba(215, 182, 101, 0.2);
    }
  }

  @keyframes pc-glow-slow {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
    33% { transform: translate(30px, 30px) scale(1.1); opacity: 0.4; }
    66% { transform: translate(-20px, -20px) scale(1.2); opacity: 0.35; }
  }

  /* Responsive */
  @media (max-width: 480px) {
    #loadingContainer {
      width: 90%;
      min-height: auto;
    }

    .pc-window-controls {
      left: 10px;
      right: 10px;
    }

    .pc-progress-wrapper {
      max-width: 100%;
    }
  }
</style>

<div class="pc-background"></div>
<div class="pc-glow pc-glow--top-left"></div>
<div class="pc-glow pc-glow--bottom-right"></div>

<div id="loadingContainer">
  <!-- Window Controls -->
  <div class="pc-window-controls">
    <button class="pc-window-btn minimize" id="minimizeBtn"></button>
    <button class="pc-window-btn close" id="closeBtn"></button>
  </div>

  <!-- Title -->
  <h1 class="pc-title">ParsCord</h1>
  <span class="pc-subtitle">Gilded Discord Client</span>

  <!-- Progress Bar -->
  <div class="pc-progress-wrapper">
    <div class="pc-progress-label">
      <span id="connectionLabel">Connecting to Discord…</span>
      <span id="progressValue" class="pc-progress-value">0%</span>
    </div>
    <div id="progressTrack" class="pc-progress-track" role="progressbar">
      <div id="progressFill" class="pc-progress-fill"></div>
    </div>
  </div>

  <!-- Status Message -->
  <div id="mainTitle" class="pc-status">Initializing…</div>

  <!-- Welcome Section -->
  <div class="pc-welcome">
    <h2 id="midtitle" style="display:none;">Welcome to ParsCord</h2>
  </div>

  <!-- Enter Button -->
  <button id="enterDiscord" class="pc-enter-button" type="button">
    Enter Discord
  </button>
</div>

<script>
  const progressFill = document.getElementById('progressFill');
  const progressValue = document.getElementById('progressValue');
  const connectionLabel = document.getElementById('connectionLabel');
  const mainTitle = document.getElementById('mainTitle');
  const minimizeBtn = document.getElementById('minimizeBtn');
  const closeBtn = document.getElementById('closeBtn');
  const enterDiscord = document.getElementById('enterDiscord');
  const loadingContainer = document.getElementById('loadingContainer');

  let progress = 0;

  const stages = [
    'Initializing…',
    'Connecting to gateway…',
    'Authenticating…',
    'Starting sessions…',
    'Syncing data…',
    'Almost ready…',
    'Ready!'
  ];

  function updateProgress(percent) {
    progress = Math.min(percent, 100);
    progressFill.style.width = `${progress}%`;
    progressValue.textContent = `${Math.round(progress)}%`;

    const stageIndex = Math.min(
      Math.floor(progress / (100 / stages.length)),
      stages.length - 1
    );
    connectionLabel.textContent = stages[stageIndex];

    if (progress >= 100) {
      progressFill.classList.add('ready');
      setTimeout(() => progressFill.classList.remove('ready'), 50);
      mainTitle.textContent = 'All systems operational';
    }
  }

  function setReady() {
    progressFill.classList.add('ready');
    connectionLabel.textContent = 'Gateway connected';
    mainTitle.textContent = 'Welcome to ParsCord';

    setTimeout(() => {
      enterDiscord.classList.add('visible');
    }, 500);
  }

  releaseVersion.textContent = '2.0.0';

  // Window controls
  closeBtn.addEventListener('click', () => {
    loadingContainer.style.opacity = '0';
    setTimeout(() => {
      loadingContainer.style.display = 'none';
      // In Tauri, this would send an event to minimize the window
    }, 400);
  });

  minimizeBtn.addEventListener('click', () => {
    // In Tauri, this would send an event to minimize the window
    // The header would show a restore button instead
    minimizeBtn.style.display = 'none';
    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'pc-window-btn restore';
    minimizeBtn.parentNode.insertBefore(restoreBtn, minimizeBtn.nextSibling);

    restoreBtn.addEventListener('click', () => {
      restoreBtn.remove();
      minimizeBtn.style.display = 'block';
      // Window restored
    });
  });

  // Hover effect on title to show draggable area hint
  loadingContainer.addEventListener('mouseenter', () => {
    loadingContainer.style.cursor = 'grab';
  });
  loadingContainer.addEventListener('mouseleave', () => {
    loadingContainer.style.cursor = 'default';
  });

  window.updateLoadingProgress = function(percent) {
    updateProgress(percent);
  };

  window.updateSessionState = function(current, total) {
    if (total > 0) {
      const percent = (current / total) * 100;
      updateProgress(percent);
    }
  };

  window.setLoadingReady = function() {
    setReady();
  };

  enterDiscord.addEventListener('click', () => {
    loadingContainer.classList.add('is-leaving');
    setTimeout(() => {
      loadingContainer.style.display = 'none';
    }, 400);
  });
</script>
